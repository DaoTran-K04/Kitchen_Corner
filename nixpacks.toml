[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.mbstring", "php82Extensions.pdo_mysql", "php82Extensions.pdo", "php82Extensions.curl", "php82Extensions.openssl", "php82Extensions.tokenizer", "php82Extensions.bcmath", "php82Extensions.fileinfo", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.xml"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[start]
cmd = "php artisan config:clear && php artisan storage:link --force || true && php artisan serve --host=0.0.0.0 --port=$PORT"

